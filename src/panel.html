<body><div class="layout"><aside class="sidebar"><div class="brand"><span class="mark">鱼</span><span>dfyBOT</span></div><nav class="nav" id="nav"><button class="active" data-page="overview"><i>▦</i><span>概览</span></button><button data-page="chats"><i>◷</i><span>会话</span></button><button data-page="persona"><i>◉</i><span>人格</span></button><button data-page="memory"><i>⌕</i><span>记忆</span></button><button data-page="stickers"><i>▣</i><span>表情包</span></button><button data-page="voice"><i>♫</i><span>语音</span></button><button data-page="proactive"><i>◷</i><span>主动搭话</span></button><button data-page="permissions"><i>◇</i><span>权限</span></button><button data-page="system"><i>⚙</i><span>系统</span></button></nav><div class="side-foot">数据保存在本机</div></aside><main class="main"><header class="top"><div class="top-left"><button class="icon mobile" id="refresh" title="刷新">↻</button><strong id="title">概览</strong><span class="health"><span class="dot" id="dot"></span><span id="health">连接中</span></span></div><div class="row-actions"><button id="dry" title="试运行只记日志，不发送消息">试运行</button><button id="toggle" class="primary">启动</button></div></header><div class="content" id="content"></div></main></div>
<div class="login" id="login"><form class="loginbox" id="loginForm"><div><h2>连接 dfyBOT</h2><p class="sub">输入本机管理令牌</p></div><label>管理令牌<input id="token" type="password" autocomplete="current-password" required></label><button class="primary">连接</button><div class="sub" id="loginError"></div></form></div><div class="toast hidden" id="toast"></div>
<script>
const $=s=>document.querySelector(s), el=(tag,attrs={},children=[])=>{const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k==='class')n.className=v;else if(k==='text')n.textContent=v;else n.setAttribute(k,v)}for(const c of children)n.append(c);return n};let token=sessionStorage.getItem('aurabot-token')||'',data={},page='overview',selectedSession='',people={};const names={overview:'概览',chats:'会话',persona:'人格',memory:'记忆',stickers:'表情包',voice:'语音',proactive:'主动搭话',permissions:'权限',system:'系统'};
async function api(path,opts={}){const r=await fetch('/api'+path,{...opts,headers:{Authorization:`Bearer ${token}`,...(opts.body instanceof FormData?{}:{'Content-Type':'application/json'}),...opts.headers}});if(r.status===401)throw Error('管理令牌无效');if(!r.ok)throw Error((await r.json().catch(()=>({}))).error||`请求失败 ${r.status}`);return r.headers.get('content-type')?.includes('json')?r.json():r.blob()}
function toast(s){const n=$('#toast');n.textContent=s;n.classList.remove('hidden');setTimeout(()=>n.classList.add('hidden'),2600)}function button(text,fn,kind=''){const b=el('button',{text,class:kind});b.onclick=fn;return b}function field(title,input){const l=el('label');l.append(el('span',{text:title}),input);return l}function input(value,attrs={}){let n=el('input',{value:String(value??''),...attrs});return n}function toggle(title,value){const l=el('label',{class:'toggle'}),i=input('',{type:'checkbox'});i.checked=!!value;l.append(i,el('span',{text:title}));return [l,i]}function heading(title,sub,actions=[]){const h=el('div',{class:'pagehead'}),l=el('div');l.append(el('h1',{text:title}));if(sub)l.append(el('div',{class:'sub',text:sub}));const a=el('div',{class:'row-actions'});actions.forEach(x=>a.append(x));h.append(l,a);return h}function section(title,content,action=null){const s=el('section',{class:'section'}),h=el('div',{class:'section-title'});h.append(el('span',{text:title}));if(action)h.append(action);s.append(h,content);return s}function table(headers,rows){const t=el('div',{class:'table-wrap'}),tb=el('table'),thead=el('thead'),tr=el('tr');headers.forEach(x=>tr.append(el('th',{text:x})));thead.append(tr);tb.append(thead);const body=el('tbody');rows.forEach(row=>body.append(row));tb.append(body);t.append(tb);return t}function td(text,cls=''){return el('td',{text:String(text??''),class:cls})}function empty(msg){return el('div',{class:'empty',text:msg})}function fmt(t){return new Date((t||0)*1000).toLocaleString()}
async function refresh(){try{data=await api('/status');$('#dot').className='dot on';$('#health').textContent=data.enabled?(data.dry_run?'试运行中':'运行中'):'已暂停';$('#toggle').textContent=data.enabled?'暂停':'启动';$('#toggle').className=data.enabled?'':'primary';$('#dry').className=data.dry_run?'primary':'';await render()}catch(e){$('#health').textContent='未连接';$('#dot').className='dot';if(token){sessionStorage.removeItem('aurabot-token');token='';$('#login').classList.remove('hidden');$('#loginError').textContent=e.message}}}
async function saveSettings(patch){const s=await api('/settings');const next={...s,...patch};await api('/settings',{method:'PUT',body:JSON.stringify(next)});toast('设置已保存');await refresh()}
async function render(){const c=$('#content');c.replaceChildren();$('#title').textContent=names[page];if(page==='overview')return overview(c);if(page==='chats')return chats(c);if(page==='persona')return persona(c);if(page==='memory')return memory(c);if(page==='stickers')return stickers(c);if(page==='voice')return voice(c);if(page==='proactive')return proactive(c);if(page==='permissions')return permissions(c);return system(c)}
async function overview(c){const [ss,logs,settings]=await Promise.all([api('/sessions?limit=8'),api('/traces?limit=12'),api('/settings')]);const grid=el('div',{class:'grid'});[["活跃会话",ss.length],["队列容量",data.queue_capacity],["工作线程",data.workers],["表情包",settings.sticker_count]].forEach(([k,v])=>{const s=el('div',{class:'stat'});s.append(el('div',{class:'k',text:k}),el('div',{class:'v',text:v}));grid.append(s)});c.append(heading('运行概览','服务状态与最近活动',[button('刷新',refresh)]),grid,section('接入与语音',table(['能力','状态','配置'],[['OneBot',data.onebot_enabled?'已启用':'未配置','反向 WebSocket'],['QQ 官方机器人',data.official_enabled?'已启用':'未配置','Webhook / Gateway'],['语音识别',data.voice_enabled?'已启用':'未配置','ASR'],['语音回复',settings.voice_replies?'已启用':'关闭','TTS']])),section('最近会话',ss.length?table(['会话','渠道','类型','最近活动','消息数'],ss.map(x=>{let r=el('tr');r.append(td(x.target,'mono'),td(x.channel),td(x.scene),td(fmt(x.updated_at)),td(x.messages));r.onclick=()=>{selectedSession=x.key;go('chats')};r.style.cursor='pointer';return r})):empty('暂无会话')),section('运行记录',logs.length?logs.map(x=>{const r=el('div',{class:'trace'});r.append(el('span',{text:fmt(x.timestamp)}),el('span',{class:'tag',text:x.kind}),el('span',{text:x.detail}));return r}):empty('暂无记录')))}
async function chats(c){const ss=await api('/sessions?limit=150');c.append(heading('聊天会话','按渠道隔离的会话记录',[button('刷新',render)]));if(!ss.length)return c.append(empty('还没有聊天记录'));const list=table(['会话','渠道 / 场景','最近活动','消息'],ss.map(x=>{const r=el('tr');r.append(td(x.target,'mono'),td(`${x.channel} · ${x.scene}`),td(fmt(x.updated_at)),td(x.messages));r.onclick=()=>{selectedSession=x.key;render()};r.style.cursor='pointer';return r}));c.append(list);if(selectedSession){const s=ss.find(x=>x.key===selectedSession);if(!s)return;const [msgs,ps]=await Promise.all([api(`/sessions/${encodeURIComponent(s.key)}?limit=80`),api('/personas')]);people=ps;const area=el('div');msgs.forEach(m=>{const x=el('div',{class:'trace'});x.append(el('span',{text:fmt(m.timestamp)}),el('span',{class:`tag ${m.role==='assistant'?'green':''}`,text:m.role==='assistant'?'大肥鱼':m.sender}),el('span',{text:m.content}));area.append(x)});const sel=el('select');sel.append(el('option',{value:'',text:'使用默认人格'}));Object.keys(ps).forEach(n=>sel.append(el('option',{value:n,text:n})));sel.value=await api(`/sessions/${encodeURIComponent(s.key)}/persona`).catch(()=>({persona:''})).then(x=>x.persona||'');const controls=el('div',{class:'row-actions'});controls.append(sel,button('应用人格',()=>api(`/sessions/${encodeURIComponent(s.key)}/persona`,{method:'PUT',body:JSON.stringify({persona:sel.value||null})}).then(()=>toast('已更新'))),button('停止当前回复',async()=>{const result=await api(`/sessions/${encodeURIComponent(s.key)}/interrupt`,{method:'POST'});toast(result.interrupted?'已停止当前回复':'当前会话没有正在生成的回复')},'danger'),button('清除会话',async()=>{if(confirm('清除该会话对话与记忆？')){await api(`/sessions/${encodeURIComponent(s.key)}`,{method:'DELETE'});selectedSession='';render()}},'danger'));const text=el('textarea',{placeholder:'向这个会话插入一条消息'});const send=button('插话并继续对话',async()=>{await api(`/sessions/${encodeURIComponent(s.key)}/interject`,{method:'POST',body:JSON.stringify({text:text.value})});text.value='';toast('消息已加入队列')},'primary');c.append(section(`会话 · ${s.target}`,controls),section('对话记录',area),section('插入消息',el('div',{class:'editor'},[text,send])) )}}
async function persona(c){people=await api('/personas');const s=await api('/settings');c.append(heading('人格','管理人格卡片，并为当前机器人选择默认人格'));const sel=el('select');Object.keys(people).forEach(n=>sel.append(el('option',{value:n,text:n})));sel.value=s.persona;const chooser=el('div',{class:'form'});chooser.append(field('默认人格',sel),field('切换',button('设为默认',()=>saveSettings({persona:sel.value}),'primary')));c.append(section('当前人格',chooser));let name=sel.value;const editor=el('textarea');editor.value=people[name]||'';sel.onchange=()=>{name=sel.value;editor.value=people[name]||''};c.append(section('人格卡片',el('div',{class:'editor'},[field('名称',input(name,{id:'personaName'})),field('内容',editor),button('保存人格',async()=>{await api('/personas',{method:'POST',body:JSON.stringify({name:$('#personaName').value,content:editor.value})});people=await api('/personas');toast('人格已保存')},'primary')])))}
async function memory(c){const [sessions,settings]=await Promise.all([api('/sessions?limit=150'),api('/settings')]);const q=el('select');q.append(el('option',{value:'*',text:'所有共享记忆'}));sessions.forEach(s=>q.append(el('option',{value:s.key,text:`${s.channel}/${s.scene} · ${s.target}`})));q.value='*';const search=input('',{placeholder:'搜索主题和内容'}),content=el('div'),kind=el('select');[['fact','事实'],['profile','人物档案'],['experience','相处经验'],['style','说话方式']].forEach(([v,t])=>kind.append(el('option',{value:v,text:t})));const importance=input(2,{type:'number',min:0,max:5}),subject=input('人物 / 主题'),text=input('记忆内容');async function load(){const ms=await api(`/memories?session=${encodeURIComponent(q.value)}&q=${encodeURIComponent(search.value)}&limit=200`);content.replaceChildren();if(!ms.length){content.append(empty('暂无匹配记忆'));return}ms.forEach(m=>{const r=el('div',{class:'memory'}),l=el('div'),details=el('div',{class:'row-actions'});l.append(el('strong',{text:`${m.subject} · ${({fact:'事实',profile:'人物档案',experience:'相处经验',style:'说话方式'})[m.kind]||'事实'} · 重要度 ${m.importance}`}),el('p',{text:m.text}),el('div',{class:'sub',text:fmt(m.updated_at)}));details.append(button('编辑',async()=>{const nextSubject=prompt('主题',m.subject);if(nextSubject===null)return;const nextText=prompt('记忆内容',m.text);if(nextText===null)return;const nextKind=prompt('类型：fact / profile / experience / style',m.kind);if(nextKind===null)return;const nextImportance=Number(prompt('重要度 0-5',m.importance));await api(`/memories/${m.id}`,{method:'PUT',body:JSON.stringify({session:m.session,kind:nextKind,subject:nextSubject,text:nextText,importance:nextImportance})});load()}),button('删除',async()=>{await api(`/memories/${m.id}`,{method:'DELETE'});load()},'danger'));r.append(l,details);content.append(r)})}q.onchange=load;search.onkeydown=e=>{if(e.key==='Enter')load()};const auto=toggle('私聊自动整理记忆',settings.auto_memory);const saveMemory=button('保存记忆设置',()=>saveSettings({auto_memory:auto[1].checked}));const add=button('添加记
